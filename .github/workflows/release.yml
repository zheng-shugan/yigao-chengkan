name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag and default branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a release tag in x.y.z format without a v prefix."
            exit 1
          fi
          if [[ "$DEFAULT_BRANCH" != main ]] || ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The release tag must point to a commit on the main default branch."
            exit 1
          fi
          git show origin/main:manifest.json | cmp manifest.json -
          node <<'NODE'
          const assert = require("node:assert/strict");
          const manifest = require("./manifest.json");
          const lock = require("./package-lock.json");
          assert.equal(manifest.version, process.env.RELEASE_TAG, "Tag must equal manifest version");
          assert.equal(require("./package.json").version, manifest.version);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[""].version, manifest.version);
          assert.equal(require("./versions.json")[manifest.version], manifest.minAppVersion);
          NODE

  check:
    needs: verify
    uses: ./.github/workflows/ci.yml

  draft:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      assets-digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build and upload the draft release
        uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
          node-version: '22'
          strict: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Record the built assets' digest
        id: digest
        run: |
          for asset in main.js manifest.json styles.css; do test -s "$asset"; done
          digest="$(sha256sum main.js manifest.json styles.css | sha256sum | cut -d ' ' -f 1)"
          printf 'value=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  publish:
    needs: draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ needs.draft.outputs.assets-digest }}
        run: |
          git show origin/main:manifest.json | cmp manifest.json -
          api_root="repos/$GITHUB_REPOSITORY/releases"
          for attempt in 1 2 3 4 5; do
            if release_id="$(gh api --paginate "$api_root?per_page=100" | jq -ers --arg tag "$RELEASE_TAG" '
                [ .[][] | select(.draft and .tag_name == $tag) ]
                | if length == 1 then .[0].id
                  else error("Expected one draft for \($tag), found \(length)") end
              ')" && asset_ids="$(gh api --paginate "$api_root/$release_id/assets?per_page=100" | jq -ces '
                add as $assets
                | ["main.js", "manifest.json", "styles.css"]
                | map(. as $name
                  | [ $assets[] | select(.name == $name and .state == "uploaded" and .size > 0) ]
                  | if length == 1 then {key: $name, value: .[0].id}
                    else error("Expected one uploaded, nonempty \($name), found \(length)") end)
                | from_entries
              ')"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Could not verify the draft release or its attachments for $RELEASE_TAG." >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

          assets_dir="$(mktemp -d)"
          trap 'rm -rf "$assets_dir"' EXIT
          for asset in main.js manifest.json styles.css; do
            asset_id="$(jq -er --arg name "$asset" '.[$name]' <<< "$asset_ids")"
            if ! gh api -H 'Accept: application/octet-stream' "$api_root/assets/$asset_id" > "$assets_dir/$asset" ||
                [[ ! -s "$assets_dir/$asset" ]]; then
              echo "Could not download $asset from draft release $release_id." >&2
              exit 1
            fi
          done
          digest="$(cd "$assets_dir" && sha256sum main.js manifest.json styles.css | sha256sum | cut -d ' ' -f 1)"
          if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "The uploaded release assets differ from the build."
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$assets_dir/notes.md"
          gh api --method PATCH "$api_root/$release_id" -F draft=false -F "body=@$assets_dir/notes.md" \
            --jq '.html_url'
